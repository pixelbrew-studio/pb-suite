name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # smoke tests are bash assertions + install wiring; no browser needed.
      PB_SKIP_PLAYWRIGHT_BROWSERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ./tests/smoke.sh
